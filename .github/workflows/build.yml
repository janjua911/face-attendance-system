name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'   # stable version (3.41 invalid hai)
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Grant permission
        run: chmod +x android/gradlew
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4   # ✅ FIX HERE
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
